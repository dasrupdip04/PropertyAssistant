<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PropertyAssistant - Grounded Real-Estate Assistant</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-brand">
        <div class="brand-logo">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>PropertyAssistant</h1>
          <span class="subtitle">Grounded real-estate assistant</span>
        </div>
      </div>
      <div class="header-actions">
        <a href="/admin" class="btn-link" title="Operator Dashboard">Admin</a>
        <button id="btn-new-search" class="btn btn-outline" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
            <path d="M21 3v5h-5"/>
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
            <path d="M8 16H3v5"/>
          </svg>
          New search
        </button>
      </div>
    </header>

    <!-- Active Filters Bar -->
    <div id="filter-bar" class="filter-bar hidden">
      <span class="filter-bar-title">Filters:</span>
      <div id="filter-chips" class="filter-chips"></div>
    </div>

    <!-- Chat Messages Stream -->
    <main id="chat-stream" class="chat-stream" role="log" aria-live="polite">
      <!-- Welcome card initially rendered here -->
    </main>

    <!-- Error Toast -->
    <div id="error-toast" class="error-toast hidden" role="alert">
      <span id="error-message" class="error-text"></span>
      <button id="btn-retry" class="btn btn-sm btn-retry" type="button">Retry</button>
      <button id="btn-dismiss-error" class="btn-dismiss" type="button" aria-label="Dismiss">&times;</button>
    </div>

    <!-- Composer -->
    <footer class="app-composer">
      <form id="chat-form" class="composer-form">
        <div class="composer-wrapper">
          <textarea
            id="user-input"
            class="composer-textarea"
            placeholder="Type your requirements... (e.g. 3 BHK in Noida under 1.2 Cr)"
            rows="1"
            maxlength="1000"
            aria-label="Message input"
          ></textarea>
          <div class="composer-bottom">
            <span id="char-counter" class="char-counter">0 / 1000</span>
            <button id="btn-send" class="btn btn-primary btn-send" type="submit" disabled aria-label="Send message">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"/>
                <polygon points="22 2 15 22 11 13 2 9 22 2"/>
              </svg>
            </button>
          </div>
        </div>
      </form>
    </footer>
  </div>

  <script src="/static/chat.js"></script>
</body>
</html>
